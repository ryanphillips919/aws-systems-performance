services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    env_file: .env
    ports: ["${HOST_IP}:5432:5432"]
    volumes: ["data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  data:
