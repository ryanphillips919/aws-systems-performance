services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d analytics"]
      interval: 2s
      timeout: 3s
      retries: 30
  dynamodb:
    image: amazon/dynamodb-local:latest@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["127.0.0.1:8001:8000"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/analytics
      STORAGE_BACKEND: ${STORAGE_BACKEND:-postgres}
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      dynamodb: {condition: service_started}
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [api]
  k6:
    image: grafana/k6:0.54.0
    profiles: [benchmark]
    volumes: ["./benchmarks:/benchmarks:ro"]
    environment:
      BASE_URL: http://api:8000
    depends_on: [api]
volumes:
  pgdata:
